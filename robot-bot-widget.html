<!-- ================= 1. ROBOT & CHATBOT STYLES ================= -->
<style>
  #agy-chat-widget * {
    box-sizing: border-box;
    font-family: 'Bricolage Grotesque', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  
  /* -------------------------------------------------------------
     A. LAUNCHER BUTTON GLOW & TILT ANIMATIONS
     ------------------------------------------------------------- */
  @keyframes agyPulseGlow {
    0%, 100% { box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 0 0 rgba(255, 78, 0, 0.5); }
    50% { box-shadow: 0 14px 35px rgba(0, 0, 0, 0.95), 0 0 0 12px rgba(255, 78, 0, 0); }
  }

  /* -------------------------------------------------------------
     B. FLOATING DRAGGABLE LAUNCHER BUTTON
     ------------------------------------------------------------- */
  #agy-chat-btn {
    position: fixed;
    bottom: 84px;
    right: 20px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #18181b 0%, #09090b 100%);
    border: 1.5px solid rgba(255, 78, 0, 0.45);
    color: white;
    cursor: grab;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65), 0 0 18px rgba(255, 78, 0, 0.28);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s, border-color 0.2s;
    user-select: none;
    touch-action: none;
  }
  #agy-chat-btn:active {
    cursor: grabbing;
    transform: scale(1.02);
  }
  #agy-chat-btn:hover {
    transform: scale(1.08);
    border-color: #ff4e00;
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.85), 0 0 24px rgba(255, 78, 0, 0.5);
  }
  
  #agy-chat-btn svg {
    filter: drop-shadow(0 0 6px rgba(255, 78, 0, 0.5));
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #agy-chat-btn:hover svg {
    transform: scale(1.1);
  }
  
  #agy-chat-btn.agy-btn-active #agy-close-icon {
    display: block !important;
  }

  /* In Dark Website Mode -> Launcher Surface */
  html.dark #agy-chat-btn {
    background: radial-gradient(circle at 35% 35%, #18181b 0%, #09090b 100%);
    border: 1.5px solid rgba(255, 78, 0, 0.5);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 78, 0, 0.35);
  }

  /* -------------------------------------------------------------
     C. ROBOT MICRO-ANIMATIONS (Eye Blink, Antenna Wiggle, Bob, Smile)
     ------------------------------------------------------------- */
  /* 1. Gentle Floating Bounce */
  @keyframes agyRobotFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-3.5px); }
  }
  .agy-float-group {
    animation: agyRobotFloat 3.2s ease-in-out infinite;
    transform-origin: 50% 50%;
  }

  /* 2. Antenna Sway & Hover Wiggle */
  @keyframes agyAntennaWiggle {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-7deg); }
    40% { transform: rotate(0deg); }
    60% { transform: rotate(7deg); }
    80% { transform: rotate(0deg); }
  }
  .agy-antenna-group {
    transform-origin: 50px 24px;
    animation: agyAntennaWiggle 3.6s ease-in-out infinite;
  }
  #agy-chat-btn:hover .agy-antenna-group {
    animation: agyAntennaHover 0.45s ease-in-out infinite alternate !important;
  }
  @keyframes agyAntennaHover {
    0% { transform: rotate(-14deg); }
    100% { transform: rotate(14deg); }
  }

  /* 3. Natural Eye Blink Cadence */
  @keyframes agyBlink {
    0%, 90%, 100% {
      transform: scaleY(1);
    }
    94% {
      transform: scaleY(0.08);
    }
    97% {
      transform: scaleY(1);
    }
  }
  .agy-eyes-group {
    transform-origin: 50% 46px;
    animation: agyBlink 3.8s infinite ease-in-out;
  }

  /* 4. Cheerful Smile & Happy Reaction on Hover */
  .agy-smile-path {
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), stroke-width 0.2s;
    transform-origin: 50% 57px;
  }
  #agy-chat-btn:hover .agy-smile-path {
    transform: scale(1.22);
    stroke-width: 3px;
  }
  #agy-chat-btn:hover .agy-float-group {
    animation: agyHappyBob 0.5s ease-in-out infinite alternate !important;
  }
  @keyframes agyHappyBob {
    0% { transform: translateY(0); }
    100% { transform: translateY(-4px); }
  }

  #agy-chat-btn:hover .agy-robot-svg {
    filter: drop-shadow(0 0 10px rgba(255, 78, 0, 0.65));
  }
  .agy-robot-svg {
    filter: drop-shadow(0 2px 6px rgba(255, 78, 0, 0.35));
    transition: filter 0.25s ease;
  }
  #agy-chat-btn.agy-btn-active .agy-robot-svg { display: none !important; }
  #agy-chat-btn.agy-btn-active #agy-close-icon { display: block !important; }

  /* -------------------------------------------------------------
     D. SPRING PHYSICS MODAL POPUP
     ------------------------------------------------------------- */
  @keyframes agyModalSpringPop {
    0% { opacity: 0; transform: scale(0.7) translateY(40px); transform-origin: bottom right; }
    70% { opacity: 1; transform: scale(1.02) translateY(-3px); }
    100% { opacity: 1; transform: scale(1) translateY(0); transform-origin: bottom right; }
  }
  @keyframes agyModalSpringShrink {
    0% { opacity: 1; transform: scale(1) translateY(0); transform-origin: bottom right; }
    100% { opacity: 0; transform: scale(0.6) translateY(40px); }
  }

  /* -------------------------------------------------------------
     E. CHATBOX CONTAINER & LAYOUT
     ------------------------------------------------------------- */
  #agy-chat-box {
    position: fixed;
    bottom: 84px;
    right: 20px;
    width: 410px;
    max-width: calc(100vw - 32px);
    height: 580px;
    max-height: calc(100vh - 100px);
    background: #0f0f12;
    border: 1.5px solid rgba(255, 78, 0, 0.45);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75), 0 0 35px rgba(255, 78, 0, 0.15);
    display: none;
    flex-direction: column;
    z-index: 999999;
    overflow: hidden;
    transform-origin: bottom right;
  }
  #agy-chat-box.agy-open {
    display: flex;
    animation: agyModalSpringPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  #agy-chat-box.agy-closing {
    animation: agyModalSpringShrink 0.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  /* Header */
  .agy-header {
    background: linear-gradient(135deg, #18181c, #0e0e12);
    color: white;
    padding: 13px 16px;
    display: flex;
    align-items: center;

  }
  .agy-header-title { display: flex; flex-direction: column; }
  .agy-header-title h4 { margin: 0; font-size: 14.5px; font-weight: 700; color: #ffffff; letter-spacing: -0.2px; }
  .agy-header-title .agy-sub-status {

  }

  .agy-header-actions { display: flex; align-items: center; gap: 6px; }
  .agy-hdr-btn {
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
    color: #a1a1aa; width: 28px; height: 28px; border-radius: 7px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .agy-hdr-btn:hover { background: rgba(255, 78, 0, 0.18); border-color: #ff4e00; color: #ffffff; }

  /* Model Status Strip */
  .agy-model-strip {
    background: #141418; padding: 5px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);

  }
  .agy-model-strip span b { color: #f97316; font-weight: 600; }

  /* Message Stream */
  .agy-messages {
    flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    background: #0a0a0c;
  }
  .agy-messages::-webkit-scrollbar { width: 5px; }
  .agy-messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }

  .agy-msg {
    max-width: 95%; padding: 12px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5;
    word-wrap: break-word; animation: agyMsgSlide 0.25s ease forwards;
  }
  @keyframes agyMsgSlide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .agy-msg.user {
    background: linear-gradient(135deg, #ff4e00, #c23800); color: #ffffff;
    align-self: flex-end; border-bottom-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(255, 78, 0, 0.25);
  }

  .agy-msg.bot {
    background: #16161a; color: #e4e4e7; align-self: flex-start;
    border-bottom-left-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.08);
    width: 100%; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  }

  /* Agent Reasoning Box */
  .agy-reasoning-card {
    background: #121215; border: 1px solid rgba(255, 78, 0, 0.3);
    border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; font-size: 11.5px;
    animation: agyMsgSlide 0.2s ease;
  }
  .agy-reasoning-header {
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 700; color: #fb923c; margin-bottom: 4px; font-size: 11px;
    letter-spacing: 0.3px;
  }
  .agy-reasoning-header span { display: flex; align-items: center; gap: 5px; }
  .agy-reasoning-step {
    display: flex; align-items: center; gap: 6px; color: #a1a1aa; font-size: 11.5px;
    padding: 3px 0; border-left: 2px solid rgba(255, 78, 0, 0.4); padding-left: 8px; margin: 2px 0;
  }
  .agy-reasoning-step.active { color: #f43f5e; font-weight: 600; }
  .agy-reasoning-step.done { color: #ff8c52; border-color: #ff8c52; }

  /* Rich Card Output Elements */
  .agy-card-badge {
    display: inline-block; font-size: 10px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.5px; color: #ff6b2b; background: rgba(255, 78, 0, 0.12);
    border: 1px solid rgba(255, 78, 0, 0.3); padding: 2px 7px; border-radius: 5px; margin-bottom: 8px;
  }
  .agy-tech-pills { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
  .agy-tech-pill {
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);

  .agy-bullet-list { margin: 6px 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .agy-bullet-list li {
    display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; color: #d4d4d8;
  }
  .agy-bullet-list li::before {
    content: "▹"; color: #ff4e00; font-weight: 900; font-size: 13px; line-height: 1.2;
  }

  .agy-action-row {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .agy-action-btn {
    background: rgba(255, 78, 0, 0.12); border: 1px solid rgba(255, 78, 0, 0.4);
    color: #ff8c52; padding: 5px 11px; border-radius: 7px; font-size: 11.5px; font-weight: 600;

  .agy-prompt-chip:hover {
    background: #23232c; border-color: #ff4e00;
    color: #ff8c52; transform: translateX(3px);
    box-shadow: 0 4px 12px rgba(255, 78, 0, 0.18);
  }
  .agy-prompt-chip span.arrow { color: #ff4e00; font-weight: bold; opacity: 0.9; margin-left: 6px; font-size: 13px; }

  /* Input Footer */
  .agy-input-area {
    padding: 10px 14px; background: #111114;
    border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; gap: 8px;
    align-items: center; flex-shrink: 0;
  }
  .agy-input-area input {
    flex: 1; border: 1px solid rgba(255, 255, 255, 0.14); padding: 9px 14px; border-radius: 20px;
    outline: none; font-size: 13px; background: #18181e; color: #ffffff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .agy-input-area input::placeholder { color: #71717a; }
  .agy-input-area input:focus {
    border-color: #ff4e00; box-shadow: 0 0 10px rgba(255, 78, 0, 0.25); background: #000000;
  }
  .agy-input-area button {
    background: linear-gradient(135deg, #ff4e00, #cc3e00); color: white;

  .agy-input-area button:hover {

  /* -------------------------------------------------------------

<div id="agy-chat-widget">

  function executeAgyPrompt(questionText) {
    const input = document.getElementById("agy-user-input");

    input.value = questionText;
    document.getElementById("agy-send-btn").click();
  }

  (function() {
    'use strict';

    // Draggable Functionality (Desktop Mouse + Mobile Touch)
    function makeDraggable(el) {
      if (!el) return;
      let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0, hasMoved = false;

      function onStart(e) {
        if (e.button !== undefined && e.button !== 0) return;
        const evt = e.touches ? e.touches[0] : e;
        isDragging = true;
        hasMoved = false;
        startX = evt.clientX;
        startY = evt.clientY;
        const rect = el.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;
        el.style.transition = "none";
      }

      function onMove(e) {
        if (!isDragging) return;
        const evt = e.touches ? e.touches[0] : e;
        const dx = evt.clientX - startX;
        const dy = evt.clientY - startY;
        if (Math.hypot(dx, dy) > 6) {
          hasMoved = true;
          if (e.cancelable) e.preventDefault();
          const btnW = el.offsetWidth || 54;
          const btnH = el.offsetHeight || 54;
          const maxLeft = window.innerWidth - btnW - 12;
          const maxTop = window.innerHeight - btnH - 12;
          const clampedLeft = Math.max(12, Math.min(maxLeft, initialLeft + dx));
          const clampedTop = Math.max(12, Math.min(maxTop, initialTop + dy));
          el.style.left = clampedLeft + "px";
          el.style.top = clampedTop + "px";
          el.style.bottom = "auto";
          el.style.right = "auto";
        }
      }

      function onEnd() {
        if (!isDragging) return;
        isDragging = false;
        el.style.transition = "transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s";
        if (hasMoved) {
          setTimeout(() => { hasMoved = false; }, 180);
        }
      }

      el.addEventListener("mousedown", onStart);
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onEnd);
      el.addEventListener("touchstart", onStart, { passive: true });
      document.addEventListener("touchmove", onMove, { passive: false });
      document.addEventListener("touchend", onEnd);
      document.addEventListener("touchcancel", onEnd);

      el.addEventListener("click", function(e) {
        if (hasMoved) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener("resize", () => {
        if (el.style.left && el.style.left !== "auto") {
          const btnW = el.offsetWidth || 54;
          const btnH = el.offsetHeight || 54;
          const maxLeft = window.innerWidth - btnW - 12;
          const maxTop = window.innerHeight - btnH - 12;
          const curLeft = parseInt(el.style.left, 10);
          const curTop = parseInt(el.style.top, 10);
          if (curLeft > maxLeft) el.style.left = maxLeft + "px";
          if (curTop > maxTop) el.style.top = maxTop + "px";
        }
      });
    }

    function initAgyBot() {
      const btn = document.getElementById("agy-chat-btn");
      const box = document.getElementById("agy-chat-box");
      const closeBtn = document.getElementById("agy-close-btn");
      const resetBtn = document.getElementById("agy-reset-btn");
      const sendBtn = document.getElementById("agy-send-btn");
      const input = document.getElementById("agy-user-input");
      const container = document.getElementById("agy-msg-container");

      if (!btn || !box) return;

      makeDraggable(btn);

      // Render primary master welcome message
      container.innerHTML = getAgyMasterWelcomeHTML();

      function openChat() {
        box.classList.remove("agy-closing");
        box.classList.add("agy-open");
        btn.classList.add("agy-btn-active");
      }

      function closeChat() {
        box.classList.remove("agy-open");
        box.classList.add("agy-closing");
        btn.classList.remove("agy-btn-active");
        setTimeout(() => box.classList.remove("agy-closing"), 220);
      }

      function toggleChat(e) {
        if (e) e.stopPropagation();
        if (box.classList.contains("agy-open")) {
          closeChat();
        } else {
          openChat();
        }
      }

      btn.addEventListener("click", toggleChat);
      closeBtn.addEventListener("click", (e) => {
        if (e) e.stopPropagation();
        closeChat();
      });

      // Reset Session
      resetBtn.addEventListener("click", () => {
        container.innerHTML = getAgyMasterWelcomeHTML();
      });

      function appendMsg(html, sender) {
        const div = document.createElement("div");
        div.className = "agy-msg " + sender;
        div.innerHTML = html;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
      }

      // 3-Step Reasoning Simulation
      function simulateAgentReasoning(userText, onComplete) {
        const reasoningDiv = document.createElement("div");
        reasoningDiv.className = "agy-reasoning-card";
        reasoningDiv.innerHTML = `

            <span style="font-size:10px;">PROCESSING</span>
          </div>
          <div class="agy-reasoning-step active" id="step-1">⚙️ Parsing semantic intent...</div>
          <div class="agy-reasoning-step" id="step-2" style="display:none;">🔍 Querying Knowledge Graph...</div>
          <div class="agy-reasoning-step" id="step-3" style="display:none;">💡 Synthesizing response...</div>

        container.appendChild(reasoningDiv);
        container.scrollTop = container.scrollHeight;

        setTimeout(() => {
          const s1 = reasoningDiv.querySelector("#step-1");
          const s2 = reasoningDiv.querySelector("#step-2");
          if (s1 && s2) {
            s1.className = "agy-reasoning-step done";
            s1.innerHTML = "✓ Intent: <b>" + (userText.length > 20 ? userText.substring(0,20) + '...' : userText) + "</b>";

            s2.className = "agy-reasoning-step active";

          container.scrollTop = container.scrollHeight;

        setTimeout(() => {
          const s2 = reasoningDiv.querySelector("#step-2");
          const s3 = reasoningDiv.querySelector("#step-3");
          if (s2 && s3) {
            s2.className = "agy-reasoning-step done";
            s2.innerHTML = "✓ Context retrieved";
            s3.style.display = "flex";
            s3.className = "agy-reasoning-step active";

              <span>✓ Reasoning complete (1.2s)</span>
              <span style="font-size:9.5px;">Claude 3.5 Sonnet</span>

        }

        // 4. Moodle / LMS
        if (low.includes("moodle") || low.includes("lms") || low.includes("e-learning") || low.includes("quiz")) {
          return `
            <span class="agy-card-badge">MOODLE LMS ARCHITECTURE</span>
            <p>Custom <b>Moodle platforms</b> with automated grading AI integrations:</p>
            <div class="agy-tech-pills">
              <span class="agy-tech-pill">Moodle 4.x</span>
              <span class="agy-tech-pill">AI Coaching Bots</span>
              <span class="agy-tech-pill">Custom Themes</span>
            </div>
            <ul class="agy-bullet-list">
              <li>Tailored course themes matching brand identities</li>
              <li>Automated student quiz feedback coaches</li>
              <li>Supports thousands of active learners</li>
            </ul>
            <div class="agy-action-row">
              <a href="mailto:studio@thedefinite.one" class="agy-action-btn">🎓 Build LMS System</a>
            </div>
          `;
        }

        // 5. Rates & Hiring
        if (low.includes("rate") || low.includes("hire") || low.includes("price") || low.includes("call")) {
          return `
            <span class="agy-card-badge">RATES & ENGAGEMENT</span>
            <p>Flexible collaboration models for founders & companies:</p>
            <ul class="agy-bullet-list">
              <li><b>Hourly Engineering:</b> ~$30 – $35 / hr</li>
              <li><b>Fixed-Scope Milestones:</b> High-velocity sprints</li>
              <li><b>Direct Email:</b> studio@thedefinite.one</li>
            </ul>
            <div class="agy-action-row">
              <a href="mailto:studio@thedefinite.one" class="agy-action-btn">📧 Send Brief</a>
              <a href="#contact" class="agy-action-btn">📞 Book Discovery Call</a>
            </div>
          `;
        }

        // 6. Default Fallback
        return getAgyMasterWelcomeHTML(`You asked: "<b>${txt}</b>". Here is an overview of our systems:`);
      }

      function handleSendMessage() {
        const txt = input.value.trim();
        if (!txt) return;

        appendMsg(txt, "user");
        input.value = "";

        // Run agent reasoning animation
        simulateAgentReasoning(txt, () => {
          const replyHtml = generateStructuredReply(txt);
          appendMsg(replyHtml, "bot");
        });
      }

      sendBtn.addEventListener("click", handleSendMessage);
      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleSendMessage();
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initAgyBot);
    } else {
      initAgyBot();
    }
  })();
</script>
